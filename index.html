<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Log Analyzer</title>
<style>
  :root{
    --bg:#14161c; --panel:#1c1f28; --panel2:#232733; --line:#2e3340;
    --txt:#e6e8ee; --dim:#9aa3b2; --accent:#f0a020; --me:#3fb0ff;
    --bar:#3a4358; --bar-me:#1d5a86; --kill:#4caf6a; --wipe:#c8503a;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);}
  header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  header h1{font-size:15px;margin:0;font-weight:600;}
  header .log{color:var(--dim);font-size:12px;}
  header .me{margin-left:auto;display:flex;align-items:center;gap:6px;}
  header input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:5px;padding:4px 8px;width:120px;}
  .layout{display:flex;height:calc(100vh - 49px);}
  aside{width:230px;flex:none;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);}
  aside .enc{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  aside .enc:hover{background:var(--panel2);}
  aside .enc.sel{background:var(--panel2);border-left:3px solid var(--accent);padding-left:11px;}
  aside .enc.sel2{border-left:3px solid var(--me);padding-left:11px;}
  aside .nightgrp{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;
    background:var(--bg);border-bottom:1px solid var(--line);font-size:12px;user-select:none;}
  aside .nightgrp:hover{background:var(--panel2);}
  aside .nightgrp .caret{display:inline-block;width:9px;color:var(--dim);font-size:10px;
    transition:transform .12s;}
  aside .nightgrp.open .caret{transform:rotate(90deg);}
  aside .nightgrp.has-sel .nd{color:var(--accent);}
  aside .nightgrp .nd{font-weight:700;color:var(--txt);white-space:nowrap;}
  aside .nightgrp .nz{color:var(--accent);font-weight:600;font-size:11px;}
  aside .nightgrp .nk{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap;}
  aside .enc.child{padding-left:24px;}
  aside .enc.child.sel{padding-left:21px;}
  aside .enc .nm{font-weight:600;}
  aside .enc .meta{font-size:11px;color:var(--dim);margin-top:2px;}
  .tag{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;}
  .tag.kill{background:var(--kill);color:#06210f;}
  .tag.wipe{background:var(--wipe);color:#2a0a05;}
  main{flex:1;overflow-y:auto;padding:18px 22px;}
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tabs button{background:none;border:none;color:var(--dim);padding:8px 14px;cursor:pointer;
    font-size:14px;border-bottom:2px solid transparent;}
  .tabs button:hover{color:var(--txt);}
  .tabs button.act{color:var(--accent);border-bottom-color:var(--accent);}
  h2{font-size:18px;margin:0 0 2px;}
  .sub{color:var(--dim);font-size:12px;margin-bottom:16px;}
  .row{display:grid;grid-template-columns:170px 1fr 130px;align-items:center;gap:10px;
    padding:3px 0;}
  .row .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .who.me{color:var(--me);font-weight:700;}
  .row .barwrap{background:var(--panel);border-radius:4px;overflow:hidden;height:20px;position:relative;}
  .row .bar{height:100%;background:var(--bar);border-radius:4px;}
  .row.me .bar{background:var(--bar-me);}
  .row .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;}
  .row .num b{color:var(--txt);}
  table{border-collapse:collapse;width:100%;max-width:720px;}
  th,td{text-align:right;padding:5px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--dim);font-weight:600;font-size:12px;}
  select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:5px;padding:5px 8px;margin-bottom:14px;}
  .cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:120px;}
  .card .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .card .v{font-size:22px;font-weight:700;margin-top:3px;}
  .note{color:var(--dim);font-size:12px;background:var(--panel);border-left:3px solid var(--accent);
    padding:8px 12px;border-radius:4px;margin-bottom:14px;}
  .agg{display:flex;flex-wrap:wrap;gap:6px;}
  .agg span{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:12px;}
  .empty{color:var(--dim);font-style:italic;padding:20px 0;}
  .nighthead,.nightrow{display:grid;grid-template-columns:170px 56px 1fr 168px;align-items:center;gap:10px;}
  .nighthead{padding:0 8px 6px;color:var(--dim);font-size:12px;font-weight:600;}
  .nightrow{padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px;}
  .nightrow:hover{background:var(--panel2);}
  .nightrow .boss{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .nightrow .barwrap{background:var(--panel);border-radius:4px;overflow:hidden;height:20px;}
  .nightrow .bar{height:100%;background:var(--bar-me);border-radius:4px;}
  .nightrow .rk{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);}
  .nightrow .rk b{color:var(--txt);}
  .nightrow .dnp{color:var(--dim);font-style:italic;font-size:12px;}
  .rank{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;
    background:var(--bar);color:var(--txt);margin-left:6px;}
  .rank.top{background:var(--accent);color:#2a1c02;}
  .skull{color:var(--wipe);margin-left:6px;}
  .runbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .runbar label{color:var(--dim);font-size:12px;}
  .runbar select{margin-bottom:0;max-width:340px;}
  .runbar .swap{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:5px;padding:5px 9px;cursor:pointer;}
  .runbar .swap:hover{border-color:var(--accent);color:var(--accent);}
  /* cascading Run 1 picker (boss -> date -> pull) */
  .picker{position:relative;display:inline-block;}
  .pickbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:5px;
    padding:5px 10px;cursor:pointer;max-width:360px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font:inherit;text-align:left;}
  .pickbtn:hover{border-color:var(--accent);}
  .pickbtn .cv{color:var(--dim);margin-left:6px;}
  .pickmenu{position:absolute;top:calc(100% + 4px);left:0;z-index:50;display:flex;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.45);}
  .pickmenu[hidden]{display:none;}
  .pcol{display:none;flex-direction:column;min-width:150px;max-height:320px;overflow-y:auto;
    border-right:1px solid var(--line);}
  .pcol:last-child{border-right:none;}
  .pcol#pcolBoss{display:flex;}
  .pcol.show{display:flex;}
  .pitem{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;font-size:13px;white-space:nowrap;}
  .pitem:hover{background:var(--panel2);}
  .pitem.on{background:var(--panel2);color:var(--accent);}
  .pitem .pz{margin-left:auto;color:var(--dim);font-size:11px;}
  .pitem .arr{color:var(--dim);margin-left:2px;}
  .panels{display:flex;gap:18px;flex-wrap:wrap;}
  .panels .panel{flex:1;min-width:300px;}
  .panels .panel h3{font-size:13px;margin:0 0 8px;font-weight:600;}
  .panels .panel h3 .lbl{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px;}
  td.pos,td .pos{color:var(--kill);} td.neg,td .neg{color:var(--wipe);}
  tr.total td{border-top:2px solid var(--line);border-bottom:none;font-weight:700;color:var(--txt);}
</style>
</head>
<body>
<header>
  <h1>WoW Log Analyzer</h1>
  <span class="log" id="logname"></span>
  <span class="me"><label>highlight</label><input id="meInput" placeholder="character"></span>
</header>
<div class="layout">
  <aside id="encList"></aside>
  <main>
    <div class="runbar" id="runbar"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>
</div>
<script>
let DATA=null, r1=0, r2=null, tab="night", me="";
const TABS=[["night","My Night"],["dps","Damage"],["hps","Healing"],["deaths","Deaths"],["pull","Pull & Aggro"],["player","Player"]];
const fmt=n=>n.toLocaleString();
const mmss=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const runs=()=>DATA.encounters;
const multiLog=()=>DATA.logs && DATA.logs.length>1;

// ---- raid-night grouping (sidebar) -----------------------------------------
// Map each boss to its instance so a night can be labelled by zone(s).
const ZONE={
  "Hydross the Unstable":"SSC","The Lurker Below":"SSC","Leotheras the Blind":"SSC",
  "Fathom-Lord Karathress":"SSC","Morogrim Tidewalker":"SSC","Lady Vashj":"SSC",
  "High King Maulgar":"Gruul","Gruul the Dragonkiller":"Gruul",
  "Al'ar":"TK","Void Reaver":"TK","High Astromancer Solarian":"TK","Kael'thas Sunstrider":"TK",
  "Magtheridon":"Mag",
  "Attumen the Huntsman":"Kara","Moroes":"Kara","Maiden of Virtue":"Kara","Opera Hall":"Kara",
  "Nightbane":"Kara","The Curator":"Kara","Terestian Illhoof":"Kara","Shade of Aran":"Kara",
  "Netherspite":"Kara","Chess Event":"Kara","Prince Malchezaar":"Kara"};
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function nightDate(log){
  const m=(log||"").match(/(\d\d)(\d\d)(\d\d)_\d{6}/);
  if(!m) return log||"run";
  const mm=+m[1], dd=+m[2], yy=2000+ +m[3];
  const d=new Date(yy,mm-1,dd);
  return `${DOW[d.getDay()]} ${MONTHS[mm-1]} ${dd}`;
}
function zonesFor(encs){
  const zs=[]; encs.forEach(e=>{const z=ZONE[e.name]; if(z&&!zs.includes(z))zs.push(z);});
  return zs.join("/");
}
let openNights={};                       // log name -> expanded?
const logOf=idx=>((runs()[idx]||{}).log)||"";
const bossOf=idx=>((runs()[idx]||{}).name)||"";
function ensureOpenFor(idx){ openNights[logOf(idx)]=true; }   // keep selection visible
// Run 2 only ever compares like-for-like; drop it if it no longer matches Run 1's boss.
function syncR2(){ if(r2!==null && bossOf(r2)!==bossOf(r1)) r2=null; }

// ---- cascading Run 1 picker: boss -> date -> pull ---------------------------
const ZONE_SEQ=["SSC","TK","Gruul","Mag","Kara"];
function bossOrder(){
  const seen=[]; runs().forEach(e=>{ if(!seen.includes(e.name)) seen.push(e.name); });
  const zi=n=>{ const k=ZONE_SEQ.indexOf(ZONE[n]); return k<0?99:k; };
  return seen.slice().sort((a,b)=> (zi(a)-zi(b)) || (seen.indexOf(a)-seen.indexOf(b)) );
}
function nightsForBoss(boss){          // [{log, pulls:[{e,i}]}] in encounter order
  const map=new Map();
  runs().forEach((e,i)=>{ if(e.name!==boss) return;
    if(!map.has(e.log)) map.set(e.log,[]);
    map.get(e.log).push({e,i});
  });
  return [...map.entries()].map(([log,pulls])=>({log,pulls}));
}
function r1Label(){
  const e=runs()[r1];
  return e?`${e.name} · ${nightDate(e.log)} · pull ${e.pull} ${e.kill?'KILL':'wipe'}`:'pick a run';
}
let pick={boss:null,log:null};         // what the open menu is drilled into
function toggleR1Menu(){
  const menu=document.getElementById("r1menu"); if(!menu) return;
  if(menu.hidden){ pick={boss:null,log:null}; menu.hidden=false; renderR1Menu();   // start with only the boss list
    document.removeEventListener("click",onDocClickR1); document.addEventListener("click",onDocClickR1);
  } else closeR1Menu();
}
function closeR1Menu(){
  const menu=document.getElementById("r1menu"); if(menu) menu.hidden=true;
  document.removeEventListener("click",onDocClickR1);
}
function onDocClickR1(ev){
  const p=document.getElementById("r1pick");
  if(p && !p.contains(ev.target)) closeR1Menu();
}
function renderR1Menu(){
  const cb=document.getElementById("pcolBoss"), cd=document.getElementById("pcolDate"), cp=document.getElementById("pcolPull");
  if(!cb) return;
  // column 1: bosses
  cb.innerHTML="";
  bossOrder().forEach(name=>{
    const it=document.createElement("div");
    it.className="pitem"+(name===pick.boss?" on":"");
    it.innerHTML=`<span>${name}</span>${ZONE[name]?`<span class="pz">${ZONE[name]}</span>`:""}<span class="arr">&rsaquo;</span>`;
    it.onclick=()=>{ pick={boss:name,log:null}; renderR1Menu(); };
    cb.appendChild(it);
  });
  // column 2: dates (nights) for the chosen boss
  cd.innerHTML="";
  if(pick.boss){
    nightsForBoss(pick.boss).forEach(g=>{
      const it=document.createElement("div");
      it.className="pitem"+(g.log===pick.log?" on":"");
      it.innerHTML=`<span>${nightDate(g.log)}</span><span class="pz">${g.pulls.length} pull${g.pulls.length>1?'s':''}</span><span class="arr">&rsaquo;</span>`;
      it.onclick=()=>{ pick.log=g.log; renderR1Menu(); };
      cd.appendChild(it);
    });
    cd.classList.add("show");
  } else cd.classList.remove("show");
  // column 3: pulls for boss + date
  cp.innerHTML="";
  const g=pick.boss&&pick.log?nightsForBoss(pick.boss).find(x=>x.log===pick.log):null;
  if(g){
    g.pulls.forEach(({e,i})=>{
      const it=document.createElement("div");
      it.className="pitem"+(i===r1?" on":"");
      it.innerHTML=`<span>pull ${e.pull}</span><span class="tag ${e.kill?'kill':'wipe'}">${e.kill?'KILL':'WIPE'}</span><span class="pz">${mmss(e.duration)}</span>`;
      it.onclick=()=>{ r1=i; syncR2(); ensureOpenFor(r1); closeR1Menu(); buildRunbar(); renderSidebar(); render(); };
      cp.appendChild(it);
    });
    cp.classList.add("show");
  } else cp.classList.remove("show");
}

fetch("/api/report").then(r=>r.json()).then(d=>{
  DATA=d; me=(d.me||"").toLowerCase();
  document.getElementById("logname").textContent=
    multiLog()?`${d.logs.length} logs · ${d.encounters.length} encounters`:d.log;
  document.getElementById("meInput").value=d.me||"";
  ensureOpenFor(r1);
  buildTabs(); buildRunbar(); renderSidebar(); render();
});
document.getElementById("meInput").addEventListener("input",e=>{me=e.target.value.trim().toLowerCase();render();});

function tagFor(e){return `<span class="tag ${e.kill?'kill':'wipe'}">${e.kill?'KILL':'WIPE'}</span>`;}
function runLabel(e){
  const base=`${e.name} · ${e.kill?'KILL':'wipe'} · pull ${e.pull} · ${mmss(e.duration)}`;
  return multiLog()?`${nightDate(e.log)} · ${base}`:base;
}
function buildTabs(){
  const t=document.getElementById("tabs"); t.innerHTML="";
  TABS.forEach(([k,label])=>{
    const b=document.createElement("button");
    b.textContent=label; b.className=k===tab?"act":"";
    b.onclick=()=>{tab=k;buildTabs();buildRunbar();render();};
    t.appendChild(b);
  });
}
function buildRunbar(){
  const bar=document.getElementById("runbar");
  // The compare runbar doesn't apply to the My Night overview — hide it there
  // so that view stays exactly as it was before compare was added.
  if(tab==="night"){ bar.style.display="none"; bar.innerHTML=""; return; }
  closeR1Menu();                       // tear down any open menu/listener before rebuild
  bar.style.display="flex";
  // Run 1: cascading boss -> date -> pull picker. Run 2: only OTHER pulls of the same boss.
  const boss=bossOf(r1);
  const matches=runs().map((e,i)=>({e,i})).filter(x=>x.i!==r1 && x.e.name===boss);
  const r2opts=`<option value="">— none (single run) —</option>`+
    matches.map(x=>`<option value="${x.i}" ${x.i===r2?'selected':''}>${runLabel(x.e)}</option>`).join("");
  const noMatch=matches.length===0;
  bar.innerHTML=`<label>Run 1</label>
    <div class="picker" id="r1pick">
      <button class="pickbtn" id="r1btn">${r1Label()}<span class="cv">&#9662;</span></button>
      <div class="pickmenu" id="r1menu" hidden>
        <div class="pcol" id="pcolBoss"></div>
        <div class="pcol" id="pcolDate"></div>
        <div class="pcol" id="pcolPull"></div>
      </div>
    </div>
    <label>Run 2</label><select id="r2sel" ${noMatch?'disabled':''}
      title="${noMatch?`no other logged pulls of ${boss}`:`other logged pulls of ${boss}`}">${r2opts}</select>
    <button class="swap" id="swapBtn" title="Swap Run 1 and Run 2">⇄ swap</button>`;
  document.getElementById("r1btn").onclick=ev=>{ev.stopPropagation();toggleR1Menu();};
  document.getElementById("r2sel").onchange=e=>{r2=e.target.value===""?null:+e.target.value;if(r2!==null)ensureOpenFor(r2);renderSidebar();render();};
  document.getElementById("swapBtn").onclick=()=>{if(r2!==null){[r1,r2]=[r2,r1];ensureOpenFor(r1);buildRunbar();renderSidebar();render();}};
}
function renderSidebar(){
  const el=document.getElementById("encList"); el.innerHTML="";
  // group encounters by source log (raid night), preserving order
  const groups=[]; const byLog={};
  runs().forEach((e,i)=>{
    const key=e.log||"";
    if(!byLog[key]){ byLog[key]={log:key,items:[]}; groups.push(byLog[key]); }
    byLog[key].items.push({e,i});
  });
  const single=groups.length<=1;          // one night: no need to collapse
  const renderEnc=({e,i})=>{
    const d=document.createElement("div");
    d.className="enc"+(single?"":" child")+(i===r1?" sel":"")+(i===r2?" sel2":"");
    d.innerHTML=`<div class="nm">${e.name}</div>
      <div class="meta">${tagFor(e)}&nbsp;pull ${e.pull} &middot; ${mmss(e.duration)}</div>`;
    d.onclick=()=>{r1=i;syncR2();if(tab==="night")tab="dps";buildTabs();buildRunbar();renderSidebar();render();};
    el.appendChild(d);
  };
  if(single){ groups.forEach(g=>g.items.forEach(renderEnc)); return; }
  groups.forEach(g=>{
    const open=!!openNights[g.log];
    const hasSel=g.items.some(x=>x.i===r1||x.i===r2);
    const kills=g.items.filter(x=>x.e.kill).length;
    const zones=zonesFor(g.items.map(x=>x.e));
    const hd=document.createElement("div");
    hd.className="nightgrp"+(open?" open":"")+(hasSel?" has-sel":"");
    hd.innerHTML=`<span class="caret">&#9656;</span>
      <span class="nd">${nightDate(g.log)}</span>
      ${zones?`<span class="nz">${zones}</span>`:""}
      <span class="nk">${kills} ${kills===1?'kill':'kills'}</span>`;
    hd.onclick=()=>{ openNights[g.log]=!openNights[g.log]; renderSidebar(); };
    el.appendChild(hd);
    if(open) g.items.forEach(renderEnc);
  });
}
function bars(rows, valKey, labelKey, fmtVal, fmtRight){
  const max=Math.max(...rows.map(r=>r[valKey]),1);
  return rows.map(r=>{
    const isMe=me && r[labelKey].toLowerCase()===me;
    const w=(100*r[valKey]/max).toFixed(1);
    return `<div class="row ${isMe?'me':''}">
      <div class="who ${isMe?'me':''}">${r[labelKey]}</div>
      <div class="barwrap"><div class="bar" style="width:${w}%"></div></div>
      <div class="num">${fmtRight(r)}</div></div>`;
  }).join("");
}
function header(e){
  return `<h2>${e.name}</h2><div class="sub">
    <span class="tag ${e.kill?'kill':'wipe'}">${e.kill?'KILL':'WIPE'}</span>
    &nbsp;pull ${e.pull} &middot; ${mmss(e.duration)} (${e.duration}s)</div>`;
}
function renderNight(){
  const v=document.getElementById("view");
  if(!me){
    v.innerHTML=`<div class="note">Type a character name in the <b>highlight</b> box (top-right)
      to see their whole night — DPS and raid rank on every boss.</div>`;
    return;
  }
  // per-encounter stats for the highlighted character
  let played=0, kills=0, deaths=0, pctSum=0, pctN=0, disp=me;
  const rows=DATA.encounters.map((e,i)=>{
    const di=e.dps.findIndex(r=>r.player.toLowerCase()===me);
    const hi=e.hps.findIndex(r=>r.player.toLowerCase()===me);
    if(disp===me){ if(di>=0)disp=e.dps[di].player; else if(hi>=0)disp=e.hps[hi].player; }
    const myDps=di>=0?e.dps[di].dps:0, topDps=e.dps.length?e.dps[0].dps:0;
    const pct=topDps?100*myDps/topDps:0;
    const dcount=e.deaths.filter(d=>d.who.toLowerCase()===me).length;
    if(di>=0||hi>=0){ played++; if(e.kill)kills++; }
    if(di>=0){ pctSum+=pct; pctN++; }
    deaths+=dcount;
    return {i,e,pct,dcount,
      rank:di>=0?di+1:0, total:e.dps.length, myDps,
      healRank:hi>=0?hi+1:0, healTotal:e.hps.length, myHps:hi>=0?e.hps[hi].hps:0};
  });
  const avgPct=pctN?Math.round(pctSum/pctN):0;
  const ranked=rows.filter(r=>r.rank);
  const bestRank=ranked.length?Math.min(...ranked.map(r=>r.rank)):0;
  const nNights=new Set(DATA.encounters.map(e=>e.log)).size;
  let h=`<h2>${disp}'s Night</h2><div class="sub">${nNights} night${nNights>1?'s':''} &middot; ${DATA.encounters.length} encounters logged</div>`;
  h+=`<div class="cards">
    <div class="card"><div class="k">Bosses played</div><div class="v">${played}</div></div>
    <div class="card"><div class="k">Kills</div><div class="v">${kills}</div></div>
    <div class="card"><div class="k">Deaths</div><div class="v">${deaths}</div></div>
    <div class="card"><div class="k">Best DPS rank</div><div class="v">${bestRank?'#'+bestRank:'—'}</div></div>
    <div class="card"><div class="k">Avg % of top</div><div class="v">${avgPct}%</div></div>
  </div>`;
  h+=`<div class="nighthead"><div>boss</div><div>result</div><div>DPS vs top dealer</div>
    <div style="text-align:right">my output &middot; rank</div></div>`;
  h+=rows.map(r=>{
    const tag=`<span class="tag ${r.e.kill?'kill':'wipe'}">${r.e.kill?'KILL':'WIPE'}</span>`;
    const skull=r.dcount?`<span class="skull" title="died ${r.dcount}×">&#9760;${r.dcount>1?r.dcount:''}</span>`:'';
    if(!r.rank && !r.healRank){
      return `<div class="nightrow" data-i="${r.i}">
        <div class="boss">${r.e.name}</div><div>${tag}</div>
        <div class="dnp">— did not participate —</div><div class="rk">${skull}</div></div>`;
    }
    const chip=r.rank?`<span class="rank ${r.rank===1?'top':''}">#${r.rank}/${r.total}</span>`:'';
    const out=r.rank?`<b>${fmt(Math.round(r.myDps))}</b> dps`
                    :`<b>${fmt(Math.round(r.myHps))}</b> hps`;
    return `<div class="nightrow" data-i="${r.i}">
      <div class="boss">${r.e.name}</div><div>${tag}</div>
      <div class="barwrap"><div class="bar" style="width:${r.pct.toFixed(1)}%"></div></div>
      <div class="rk">${out}${chip}${skull}</div></div>`;
  }).join("");
  v.innerHTML=h;
  v.querySelectorAll(".nightrow").forEach(el=>{
    el.onclick=()=>{r1=+el.dataset.i;r2=null;ensureOpenFor(r1);tab="dps";buildTabs();buildRunbar();renderSidebar();render();};
  });
}
function render(){
  if(tab==="night"){ renderNight(); return; }
  if(r2===null) renderSingle(runs()[r1]);
  else renderCompare(runs()[r1], runs()[r2]);
}
function renderSingle(e){
  const v=document.getElementById("view");
  if(tab==="dps"){
    v.innerHTML=header(e)+ (e.dps.length?bars(e.dps,"dps","player",null,
      r=>`<b>${fmt(Math.round(r.dps))}</b> dps${r.petPct?` &middot; ${r.petPct}% pet`:""}`)
      :`<div class="empty">no damage</div>`);
  }else if(tab==="hps"){
    v.innerHTML=header(e)+ (e.hps.length?bars(e.hps,"hps","player",null,
      r=>`<b>${fmt(Math.round(r.hps))}</b> hps &middot; ${r.overPct}% OH`)
      :`<div class="empty">no healing</div>`);
  }else if(tab==="deaths"){
    let h=header(e);
    if(!e.deaths.length){h+=`<div class="empty">no player deaths — clean kill!</div>`;}
    else{h+=`<table><tr><th>time</th><th>who</th><th>killed by</th><th>spell</th><th>hit</th></tr>`+
      e.deaths.map(d=>{const isMe=me&&d.who.toLowerCase()===me;
        return `<tr><td>${mmss(d.t)}</td><td style="text-align:left" class="${isMe?'who me':''}">${d.who}</td>
        <td style="text-align:left">${d.by}</td><td style="text-align:left">${d.spell}</td><td>${fmt(d.amount)}</td></tr>`;
      }).join("")+`</table>`;}
    v.innerHTML=h;
  }else if(tab==="pull"){
    let h=header(e)+`<div class="note">Threat isn't recorded in combat logs. These are <b>inferred</b>:
      the opener = first player hit landed on the boss; the timeline = who the boss was auto-attacking.</div>`;
    if(e.first_on_boss){const f=e.first_on_boss;
      h+=`<div class="cards"><div class="card"><div class="k">Pull started by</div>
        <div class="v" ${me&&f.who.toLowerCase()===me?'style="color:var(--me)"':''}>${f.who}</div>
        <div class="k">${f.spell} @ ${f.t}s</div></div></div>`;}
    h+=`<h2 style="font-size:14px">Boss melee target over time (≈ aggro)</h2>`;
    h+= e.aggro.length? `<div class="agg">`+e.aggro.map(a=>{
        const isMe=me&&a.target.toLowerCase()===me;
        return `<span ${isMe?'style="color:var(--me);border-color:var(--me)"':''}>${mmss(a.t)} → ${a.target}</span>`;
      }).join("")+`</div>` : `<div class="empty">boss did no resolvable melee swings</div>`;
    v.innerHTML=h;
  }else if(tab==="player"){
    const names=Object.keys(e.players).sort();
    let cur=me&&e.players[Object.keys(e.players).find(n=>n.toLowerCase()===me)]?
      Object.keys(e.players).find(n=>n.toLowerCase()===me):(window._pl&&e.players[window._pl]?window._pl:names[0]);
    window._pl=cur;
    let h=header(e);
    h+=`<select id="plSel">`+names.map(n=>`<option ${n===cur?'selected':''}>${n}</option>`).join("")+`</select>`;
    if(cur){const p=e.players[cur];
      h+=`<div class="cards">
        <div class="card"><div class="k">Damage</div><div class="v">${fmt(p.damage)}</div><div class="k">${fmt(Math.round(p.dps))} DPS</div></div>
        ${p.heal?`<div class="card"><div class="k">Healing (eff)</div><div class="v">${fmt(p.heal)}</div><div class="k">${fmt(Math.round(p.hps))} HPS</div></div>`:""}
      </div>`;
      if(p.spells.length){
        const tot=p.damage||1;
        h+=`<table><tr><th>spell</th><th>damage</th><th>%</th><th>hits</th><th>crit%</th><th>max</th></tr>`+
          p.spells.map(s=>`<tr><td>${s.spell}</td><td>${fmt(s.dmg)}</td>
            <td>${Math.round(100*s.dmg/tot)}%</td><td>${s.hits}</td>
            <td>${s.hits?Math.round(100*s.crits/s.hits):0}%</td><td>${fmt(s.max)}</td></tr>`).join("")+`</table>`;
      }
      if(p.healspells.length){
        h+=`<h2 style="font-size:14px;margin-top:18px">Healing</h2>
          <table><tr><th>spell</th><th>eff heal</th><th>overheal%</th><th>casts</th></tr>`+
          p.healspells.map(s=>`<tr><td>${s.spell}</td><td>${fmt(s.eff)}</td>
            <td>${(s.eff+s.over)?Math.round(100*s.over/(s.eff+s.over)):0}%</td><td>${s.hits}</td></tr>`).join("")+`</table>`;
      }
    }
    v.innerHTML=h;
    const selEl=document.getElementById("plSel");
    if(selEl)selEl.onchange=ev=>{window._pl=ev.target.value;render();};
  }
}

// ---- comparison helpers ----------------------------------------------------
function cmpHeader(a,b){
  let h=`<h2>${tab==="dps"?"Damage":tab==="hps"?"Healing":tab==="deaths"?"Deaths":tab==="pull"?"Pull & Aggro":"Player"} — comparison</h2>
    <div class="sub">A: ${tagFor(a)} ${runLabel(a)} &nbsp;vs&nbsp; B: ${tagFor(b)} ${runLabel(b)}</div>`;
  if(a.name!==b.name)
    h+=`<div class="note">You're comparing two <b>different encounters</b> (${a.name} vs ${b.name}); per-player deltas still apply but won't be like-for-like.</div>`;
  return h;
}
// union rows from A and B keyed by `key`, pulling numeric `valKey` (0 if absent)
function joinByKey(aRows,bRows,key,valKey){
  const m=new Map();
  (aRows||[]).forEach(r=>m.set(r[key],{k:r[key],a:r[valKey]||0,b:0}));
  (bRows||[]).forEach(r=>{const e=m.get(r[key])||{k:r[key],a:0,b:0};e.b=r[valKey]||0;m.set(r[key],e);});
  return [...m.values()];
}
// two <td>: signed delta + signed delta% (colored). a,b already numbers.
// Δ reads as the change from Run A -> Run B (B minus A), so green = B improved
// on A, red = B dropped. Percent is relative to A (the starting run).
function dCells(a,b){
  const d=Math.round(b)-Math.round(a);
  const cls=d>0?"pos":d<0?"neg":"";
  const sign=d>0?"+":d<0?"-":"";
  const pct=a?`${sign}${Math.round(Math.abs(100*d/a))}%`:(b?"new":"—");
  return `<td class="${cls}">${sign}${fmt(Math.abs(d))}</td><td class="${cls}">${pct}</td>`;
}
function cmpMetricTable(a,b,key,valKey,unit){
  const rows=joinByKey(a,b,"player",valKey).sort((x,y)=>y.a-x.a);
  if(!rows.length) return `<div class="empty">no ${unit} in either run</div>`;
  let ta=0,tb=0;
  const body=rows.map(r=>{
    ta+=r.a; tb+=r.b;
    const isMe=me && r.k.toLowerCase()===me;
    return `<tr><td style="text-align:left" class="${isMe?'who me':''}">${r.k}</td>
      <td>${fmt(Math.round(r.a))}</td><td>${fmt(Math.round(r.b))}</td>${dCells(r.a,r.b)}</tr>`;
  }).join("");
  return `<table><tr><th>player</th><th>A ${unit}</th><th>B ${unit}</th><th>Δ</th><th>Δ%</th></tr>`+
    body+`<tr class="total"><td style="text-align:left">RAID</td>
      <td>${fmt(Math.round(ta))}</td><td>${fmt(Math.round(tb))}</td>${dCells(ta,tb)}</tr></table>`;
}
function deathsPanel(e){
  let h=`<div class="card" style="margin-bottom:10px"><div class="k">Deaths</div><div class="v">${e.deaths.length}</div></div>`;
  if(!e.deaths.length) return h+`<div class="empty">no player deaths — clean kill!</div>`;
  return h+`<table><tr><th>time</th><th>who</th><th>killed by</th><th>spell</th></tr>`+
    e.deaths.map(d=>{const isMe=me&&d.who.toLowerCase()===me;
      return `<tr><td>${mmss(d.t)}</td><td style="text-align:left" class="${isMe?'who me':''}">${d.who}</td>
      <td style="text-align:left">${d.by}</td><td style="text-align:left">${d.spell}</td></tr>`;
    }).join("")+`</table>`;
}
function pullPanel(e){
  let h="";
  if(e.first_on_boss){const f=e.first_on_boss;
    h+=`<div class="cards"><div class="card"><div class="k">Pull started by</div>
      <div class="v" ${me&&f.who.toLowerCase()===me?'style="color:var(--me)"':''}>${f.who}</div>
      <div class="k">${f.spell} @ ${f.t}s</div></div></div>`;
  } else h+=`<div class="empty">opener not resolved</div>`;
  h+= e.aggro.length? `<div class="agg" style="margin-top:8px">`+e.aggro.map(a=>{
      const isMe=me&&a.target.toLowerCase()===me;
      return `<span ${isMe?'style="color:var(--me);border-color:var(--me)"':''}>${mmss(a.t)} → ${a.target}</span>`;
    }).join("")+`</div>` : `<div class="empty">no resolvable melee swings</div>`;
  return h;
}
function twoPanels(a,b,fn){
  return `<div class="panels">
    <div class="panel"><h3>Run A<span class="lbl">${runLabel(a)}</span></h3>${fn(a)}</div>
    <div class="panel"><h3>Run B<span class="lbl">${runLabel(b)}</span></h3>${fn(b)}</div></div>`;
}
function renderCompare(a,b){
  const v=document.getElementById("view");
  let h=cmpHeader(a,b);
  if(tab==="dps"){
    h+=cmpMetricTable(a.dps,b.dps,"player","dps","dps");
  }else if(tab==="hps"){
    h+=cmpMetricTable(a.hps,b.hps,"player","hps","hps");
  }else if(tab==="deaths"){
    h+=twoPanels(a,b,deathsPanel);
  }else if(tab==="pull"){
    h+=`<div class="note">Threat isn't recorded in combat logs. These are <b>inferred</b>:
      the opener = first player hit on the boss; the timeline = who the boss was auto-attacking.</div>`;
    h+=twoPanels(a,b,pullPanel);
  }else if(tab==="player"){
    const names=[...new Set([...Object.keys(a.players),...Object.keys(b.players)])].sort();
    let cur=names.find(n=>n.toLowerCase()===me) || (window._cpl&&names.includes(window._cpl)?window._cpl:names[0]);
    window._cpl=cur;
    h+=`<select id="cplSel">`+names.map(n=>`<option ${n===cur?'selected':''}>${n}</option>`).join("")+`</select>`;
    if(cur){
      const pa=a.players[cur]||{damage:0,dps:0,heal:0,hps:0,spells:[],healspells:[]};
      const pb=b.players[cur]||{damage:0,dps:0,heal:0,hps:0,spells:[],healspells:[]};
      h+=`<table style="max-width:560px"><tr><th>metric</th><th>A</th><th>B</th><th>Δ</th><th>Δ%</th></tr>
        <tr><td style="text-align:left">Damage</td><td>${fmt(pa.damage)}</td><td>${fmt(pb.damage)}</td>${dCells(pa.damage,pb.damage)}</tr>
        <tr><td style="text-align:left">DPS</td><td>${fmt(Math.round(pa.dps))}</td><td>${fmt(Math.round(pb.dps))}</td>${dCells(pa.dps,pb.dps)}</tr>`;
      if(pa.heal||pb.heal)
        h+=`<tr><td style="text-align:left">Healing (eff)</td><td>${fmt(pa.heal)}</td><td>${fmt(pb.heal)}</td>${dCells(pa.heal,pb.heal)}</tr>
            <tr><td style="text-align:left">HPS</td><td>${fmt(Math.round(pa.hps))}</td><td>${fmt(Math.round(pb.hps))}</td>${dCells(pa.hps,pb.hps)}</tr>`;
      h+=`</table>`;
      const sp=joinByKey(pa.spells,pb.spells,"spell","dmg").sort((x,y)=>y.a-x.a);
      if(sp.length){
        h+=`<h2 style="font-size:14px;margin-top:18px">Damage by spell</h2>
          <table><tr><th>spell</th><th>A</th><th>B</th><th>Δ</th><th>Δ%</th></tr>`+
          sp.map(r=>`<tr><td style="text-align:left">${r.k}</td><td>${fmt(r.a)}</td><td>${fmt(r.b)}</td>${dCells(r.a,r.b)}</tr>`).join("")+`</table>`;
      }
      const hsp=joinByKey(pa.healspells,pb.healspells,"spell","eff").sort((x,y)=>y.a-x.a);
      if(hsp.length){
        h+=`<h2 style="font-size:14px;margin-top:18px">Healing by spell (effective)</h2>
          <table><tr><th>spell</th><th>A</th><th>B</th><th>Δ</th><th>Δ%</th></tr>`+
          hsp.map(r=>`<tr><td style="text-align:left">${r.k}</td><td>${fmt(r.a)}</td><td>${fmt(r.b)}</td>${dCells(r.a,r.b)}</tr>`).join("")+`</table>`;
      }
    }
  }
  v.innerHTML=h;
  const selEl=document.getElementById("cplSel");
  if(selEl)selEl.onchange=ev=>{window._cpl=ev.target.value;render();};
}
</script>
